<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="Bac Bo Signal Bot - análise estatística">
  <link rel="manifest" href="manifest.json">
  <title>Bac Bo Signal Bot</title>

  <style>
    :root {
      --bg:#050a09;
      --panel:#0c1212;
      --line:#164b31;
      --green:#16e66d;
      --text:#b8f2c9;
      --muted:#579b72;
      --blue:#1597e5;
      --orange:#ff9d00;
      --red:#ed4169;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 20%,#07331d 0,#07100d 42%,#030706 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body:before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.10;
      background:repeating-linear-gradient(
        0deg,
        transparent 0 3px,
        #19d86b 4px,
        #19d86b 5px
      );
    }

    .app {
      max-width:720px;
      margin:auto;
      padding-bottom:30px;
    }

    .top {
      padding:24px 20px 18px;
      border-bottom:1px solid #123e2a;
      background:#080e0d;
    }

    .brand {
      font-size:30px;
      font-weight:900;
      letter-spacing:2px;
      color:#14e967;
    }

    .sub {
      color:#559a70;
      margin-top:2px;
      font-size:14px;
      letter-spacing:1px;
    }

    .online {
      float:right;
      margin-top:-38px;
      border:1px solid #1b5c3a;
      border-radius:30px;
      padding:10px 14px;
      color:var(--green);
    }

    .online b {
      font-size:18px;
    }

    .card {
      margin:18px 18px 0;
      padding:18px;
      border:1px solid #155b38;
      border-radius:20px;
      background:linear-gradient(145deg,#101817,#080d0d);
      box-shadow:0 0 25px #062c1a;
    }

    .label {
      font-size:12px;
      color:#579b72;
      text-transform:uppercase;
      letter-spacing:1.5px;
    }

    .signal {
      display:flex;
      align-items:center;
      gap:14px;
      margin-top:8px;
    }

    .signal-ball {
      width:62px;
      height:62px;
      min-width:62px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:25px;
      font-weight:900;
      background:#123c28;
      border:2px solid var(--green);
    }

    .signal-main {
      font-size:27px;
      font-weight:900;
      color:#d4ffe1;
    }

    .confidence {
      margin-left:auto;
      text-align:right;
    }

    .confidence strong {
      font-size:23px;
      color:var(--green);
    }

    .bar {
      height:8px;
      background:#15221d;
      border-radius:9px;
      overflow:hidden;
      margin-top:12px;
    }

    .bar > i {
      display:block;
      height:100%;
      background:#16e66d;
      width:0%;
      transition:.3s;
    }

    .hint {
      margin-top:8px;
      color:#6bb789;
      font-size:13px;
    }

    .section-title {
      margin:24px 18px 10px;
      font-weight:800;
      color:#8ddca7;
    }

    .history {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      padding:0 18px;
    }

    .dot {
      width:39px;
      height:39px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:900;
      color:white;
      border:2px solid #ffffff25;
    }

    .p {
      background:var(--blue);
    }

    .b {
      background:var(--orange);
      color:#1c1300;
    }

    .e {
      background:var(--red);
    }

    .inputs {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      padding:0 18px;
    }

    .btn {
      border:0;
      border-radius:15px;
      padding:16px 8px;
      font-size:16px;
      font-weight:900;
      color:white;
      box-shadow:0 6px 16px #0008;
    }

    .btn:active {
      transform:scale(.97);
    }

    .btn.p {
      background:#168ed7;
    }

    .btn.b {
      background:#e98e00;
    }

    .btn.e {
      background:#df3d64;
    }

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .stat {
      text-align:center;
      padding:14px 8px;
      background:#0a1210;
      border:1px solid #174b32;
      border-radius:14px;
    }

    .stat b {
      display:block;
      font-size:22px;
      color:#bfffd0;
    }

    .stat span {
      font-size:11px;
      color:#579b72;
    }

    .actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .secondary {
      background:#111b18;
      color:#9be0af;
      border:1px solid #245b3d;
      border-radius:13px;
      padding:13px;
      font-weight:800;
    }

    .warning {
      margin-top:12px;
      color:#c9d7ce;
      font-size:12px;
      line-height:1.45;
    }

    .footer {
      text-align:center;
      color:#477c5d;
      font-size:11px;
      margin:24px;
    }

    @media(max-width:420px) {
      .brand {
        font-size:25px;
      }

      .online {
        font-size:12px;
      }

      .signal-main {
        font-size:21px;
      }

      .confidence strong {
        font-size:19px;
      }

      .btn {
        font-size:14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="brand">BAC BO SIGNAL</div>
    <div class="sub">ANÁLISE ESTATÍSTICA v2.0</div>

    <div class="online">
      ● <b id="roundCount">0</b> rodadas
    </div>
  </header>


  <section class="card">

    <div class="label">
      Sinal calculado
    </div>

    <div class="signal">

      <div id="signalBall" class="signal-ball">
        —
      </div>

      <div>
        <div id="signalText" class="signal-main">
          SEM SINAL
        </div>

        <div id="signalReason" class="hint">
          Introduza pelo menos 10 resultados.
        </div>
      </div>

      <div class="confidence">
        <strong id="confidence">0%</strong>
        <div class="label">confiança</div>
      </div>

    </div>

    <div class="bar">
      <i id="confidenceBar"></i>
    </div>

    <div class="warning">
      O sinal é uma análise estatística e não uma garantia de resultado.
      Resultados anteriores não determinam a próxima rodada.
    </div>

  </section>


  <div class="section-title">
    Histórico recente
  </div>

  <div id="history" class="history"></div>


  <div class="section-title">
    Adicionar resultado
  </
